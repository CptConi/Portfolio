      <div class="start-vignette"></div>

      <div class="start-stage">
        <div class="start-kicker">PORTFOLIO INTERACTIF</div>

        <h1 class="start-title" data-text="NICOLAS RENARD">NICOLAS RENARD</h1>

        <div class="start-role">

          LEAD&nbsp;DEVELOPER
          <span class="role-sep">//</span>

          <span class="role-bracket">]</span>

        <div class="start-sub">▶&nbsp;&nbsp;INSÉRER UN JETON&nbsp;&nbsp;◀</div>

        <div class="start-controls start-kb-only">
          <span class="kc"><b>WASD</b><i>DÉPLACER</i></span>
          <span class="kc"><b>SOURIS</b><i>REGARDER</i></span>
          <span class="kc"><b>E&nbsp;/&nbsp;ESPACE</b><i>INTERAGIR</i></span>
          <span class="kc"><b>ESC</b><i>FERMER</i></span>
        </div>

        <div class="start-controls start-touch-only">
          <span class="kc"><b>STICK&nbsp;G.</b><i>DÉPLACER</i></span>
          <span class="kc"><b>GLISSER&nbsp;D.</b><i>REGARDER</i></span>
          <span class="kc"><b>BOUTON</b><i>INTERAGIR</i></span>
        </div>
      </div>
    </div>

    <!-- Game -->
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
